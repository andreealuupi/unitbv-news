<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">

<title>UNITBV Știri și Evenimente</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
}

.slide{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* FUNDAL */
.background{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;

    filter:blur(5px) brightness(0.55);

    transform:scale(1.08);
}

/* IMAGINE PRINCIPALA */
.foreground{

    position:absolute;

    top:3%;
    left:50%;

    transform:translateX(-50%);

    width:auto;
    height:58%;

    object-fit:contain;

    border-radius:22px;

    border:3px solid rgba(255,255,255,0.7);

    box-shadow:
    0 10px 35px rgba(0,0,0,0.45);

    background:none;

    padding:0;
}

/* GRADIENT */
.dark-gradient{
    position:absolute;
    bottom:0;
    width:100%;
    height:58%;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,0.72) 35%,
        rgba(0,0,0,0.96)
    );
}

/* HEADER */
.header{
    position:absolute;
    top:30px;
    left:35px;

    z-index:5;
}

.logo-box{
    background:white;
    color:#06224a;

    padding:14px 26px;

    border-radius:12px;

    font-size:34px;
    font-weight:bold;

    box-shadow:0 8px 25px rgba(0,0,0,0.35);
}

/* INFO */
.info{
    position:absolute;

    left:60px;
    right:60px;

    bottom:95px;

    z-index:5;
}

.title{

    font-size:50px;

    line-height:1.10;

    font-weight:bold;

    margin-bottom:22px;

    max-width:90%;

    text-shadow:
    0 5px 20px rgba(0,0,0,0.85);
}

.blue-line{
    width:430px;
    height:6px;

    background:#1a73e8;

    margin-bottom:24px;
}

/* DESCRIERE */
.date{

    font-size:22px;

    color:#e0e0e0;

    line-height:1.5;

    max-width:82%;

    margin-bottom:16px;

    text-shadow:
    0 4px 16px rgba(0,0,0,0.85);

    display:-webkit-box;

    -webkit-line-clamp:4;
line-clamp:4;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

/* DATA */
.event-date{

    font-size:30px;

    font-weight:bold;

    color:white;

    text-shadow:
    0 4px 16px rgba(0,0,0,0.85);
}

/* FOOTER */
.footer{
    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:82px;

    background:
    linear-gradient(
        90deg,
        #06224a,
        #0b4f9c
    );

    display:flex;
    align-items:center;

    padding:0 60px;

    z-index:6;

    font-size:28px;
    font-weight:bold;
}

.footer-left{
    display:flex;
    align-items:center;
    gap:18px;
}

.footer-icon{
    font-size:34px;
}

/* ANIMATIE */
.fade{
    animation:fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media (max-width:1400px){

    .title{
        font-size:42px;
    }

    .date{
        font-size:20px;
    }

    .event-date{
        font-size:26px;
    }

    .foreground{
        max-width:88%;
        max-height:60%;
    }
}

</style>

</head>

<body>

<div class="slide">

    <img id="bgImage"
         class="background"
         src="">

    <img id="image"
         class="foreground"
         src="">

    <div class="dark-gradient"></div>

    <div class="header">

        <div class="logo-box">
            UNITBV
        </div>

    </div>

    <div class="info fade"
         id="infoBox">

        <div class="title"
             id="title">

            Se încarcă evenimentele...

        </div>

        <div class="blue-line"></div>

        <div class="date"
             id="date"></div>

        <div class="event-date"
             id="eventDate"></div>

    </div>

    <div class="footer">

        <div class="footer-left">

            <div class="footer-icon">
                ▣
            </div>

            <div>
                ȘTIRI ȘI EVENIMENTE
            </div>

        </div>

    </div>

</div>

<script>

const RSS_URL =
"https://www.unitbv.ro/stiri-si-evenimente.feed?limit=20&type=rss";

const RSS_API =
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(RSS_URL);

const ARTICLE_PROXY =
"https://corsproxy.io/?";

let items = [];
let current = 0;
let slideInterval = null;

const slideTime = 20000;

async function loadRSS(){

    try{

        const response =
        await fetch(RSS_API + "&t=" + Date.now());

        const data =
        await response.json();

        items = data.items || [];

        console.log("Items:", items.length);

        if(items.length === 0){

            document.getElementById("title").innerText =
            "Nu există evenimente disponibile.";

            return;
        }

        if(slideInterval){
            clearInterval(slideInterval);
        }

        current = 0;

        await showSlide(current);

        slideInterval = setInterval(async ()=>{

            current++;

            if(current >= items.length){
                current = 0;
            }

            await showSlide(current);

        }, slideTime);

    }catch(error){

        console.error(error);

        document.getElementById("title").innerText =
        "Eroare la încărcarea evenimentelor.";

        document.getElementById("date").innerText =
        "Verifică conexiunea la internet.";
    }
}

function extractImage(html){

    const div = document.createElement("div");

    div.innerHTML = html || "";

    const img = div.querySelector("img");

    return img ? img.src : "";
}

function extractDate(html){

    const div = document.createElement("div");

    div.innerHTML = html || "";

    const img = div.querySelector("img");

    if(img){
        img.remove();
    }

    return div.textContent
        .replace(/\s+/g," ")
        .replace(/\u00A0/g," ")
        .trim();
}

function limitToSentence(text){

    text = text
        .replace(/\s+/g," ")
        .replace(/\u00A0/g," ")
        .trim();

    if(text.length <= 520){
        return text;
    }

    const shortText = text.substring(0,520);

    const lastEnd = Math.max(
        shortText.lastIndexOf("."),
        shortText.lastIndexOf("!"),
        shortText.lastIndexOf("?")
    );

    if(lastEnd > 180){
        return shortText.substring(0,lastEnd + 1);
    }

    return shortText;
}

async function getArticleText(link){

    try{

        const response =
        await fetch(
            ARTICLE_PROXY + encodeURIComponent(link)
        );

        const html =
        await response.text();

        const parser =
        new DOMParser();

        const doc =
        parser.parseFromString(html,"text/html");

        const paragraphs =
        [...doc.querySelectorAll("p")];

        for(const p of paragraphs){

            const t = p.textContent
                .replace(/\s+/g," ")
                .replace(/\u00A0/g," ")
                .trim();

            if(t.length > 120){
                return limitToSentence(t);
            }
        }

        return "";

    }catch(error){

        console.error("ARTICLE ERROR:", error);

        return "";
    }
}

async function showSlide(index){

    const item = items[index];

    const image =
    extractImage(item.description || "");

    const dateText =
    extractDate(item.description || "");

    const articleText =
    await getArticleText(item.link);

    /* fallback din content RSS */
    const div =
    document.createElement("div");

    div.innerHTML =
    item.content || item.description || "";

    const img =
    div.querySelector("img");

    if(img){
        img.remove();
    }

    const fallbackText =
    div.textContent
        .replace(/\s+/g," ")
        .replace(/\u00A0/g," ")
        .trim();

    document.getElementById("title").innerText =
    item.title || "";

    document.getElementById("date").innerText =
    articleText || limitToSentence(fallbackText);

    document.getElementById("eventDate").innerText =
    dateText || "";

    document.getElementById("image").src =
    image;

    document.getElementById("bgImage").src =
    image;

    const infoBox =
    document.getElementById("infoBox");

    infoBox.classList.remove("fade");

    void infoBox.offsetWidth;

    infoBox.classList.add("fade");
}

loadRSS();

setInterval(()=>{
    loadRSS();
}, 300000);

</script>
</body>

</html>
