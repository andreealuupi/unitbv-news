
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>UNITBV Știri și Evenimente</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
}

.slide {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #000;
}

/* FUNDAL */
.background {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: blur(12px) brightness(0.42) saturate(1.08);
    transform: scale(1.12);
    image-rendering: auto;
    display: none;
}

/* IMAGINE PRINCIPALA */
.foreground {
    position: absolute;
    top: 3.5%;
    left: 50%;
    transform: translate3d(-50%, 0, 0);
    width: auto;
    height: 57%;
    max-width: 90%;
    max-height: 60%;
    object-fit: contain;
    object-position: center;
    border-radius: 22px;
    border: 3px solid rgba(255,255,255,0.82);
    box-shadow: 0 10px 35px rgba(0,0,0,0.55);
    background: #111;
    image-rendering: auto;
    backface-visibility: hidden;
    padding: 0;
    display: none;
}

/* GRADIENT */
.dark-gradient {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 58%;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,0.72) 35%,
        rgba(0,0,0,0.96)
    );
}

/* HEADER */
.header {
    position: absolute;
    top: 30px;
    left: 35px;
    z-index: 5;
}

.logo-box {
    background: white;
    color: #06224a;
    padding: 14px 26px;
    border-radius: 12px;
    font-size: 34px;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

/* INFO */
.info {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 95px;
    z-index: 5;
}

.title {
    font-size: 50px;
    line-height: 1.10;
    font-weight: bold;
    margin-bottom: 22px;
    max-width: 90%;
    text-shadow: 0 5px 20px rgba(0,0,0,0.85);
}

.blue-line {
    width: 430px;
    height: 6px;
    background: #1a73e8;
    margin-bottom: 24px;
}

/* DESCRIERE */
.date {
    font-size: 22px;
    color: #e0e0e0;
    line-height: 1.5;
    max-width: 82%;
    margin-bottom: 16px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.85);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* DATA */
.event-date {
    font-size: 30px;
    font-weight: bold;
    color: white;
    text-shadow: 0 4px 16px rgba(0,0,0,0.85);
}

/* FOOTER */
.footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 82px;
    background: linear-gradient(
        90deg,
        #06224a,
        #0b4f9c
    );
    display: flex;
    align-items: center;
    padding: 0 60px;
    z-index: 6;
    font-size: 28px;
    font-weight: bold;
}

.footer-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.footer-icon {
    font-size: 34px;
}

/* ANIMATIE */
.fade {
    animation: fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE */
@media (max-width: 1400px) {
    .title {
        font-size: 42px;
    }

    .date {
        font-size: 20px;
    }

    .event-date {
        font-size: 26px;
    }

    .foreground {
        max-width: 90%;
        max-height: 60%;
    }
}
</style>
</head>

<body>

<div class="slide">

    <img
        id="bgImage"
        class="background"
        alt="Fundal eveniment"
    >

    <img
        id="image"
        class="foreground"
        alt="Imagine eveniment"
    >

    <div class="dark-gradient"></div>

    <div class="header">
        <div class="logo-box">
            UNITBV
        </div>
    </div>

    <div class="info fade" id="infoBox">

        <div class="title" id="title">
            Se încarcă evenimentele...
        </div>

        <div class="blue-line"></div>

        <div class="date" id="date"></div>

        <div
            class="event-date"
            id="eventDate"
        ></div>

    </div>

    <div class="footer">
        <div class="footer-left">
            <div class="footer-icon">▣</div>
            <div>ȘTIRI ȘI EVENIMENTE</div>
        </div>
    </div>

</div>

<script>

/*
  UNITBV NEWS - LIVE

  Stirile sunt preluate automat de GitHub Actions
  de pe pagina oficiala UNITBV.

  Browserul citeste doar news.json
  de pe acelasi domeniu GitHub Pages.

  Nu mai folosim rss2json sau CORS proxy
  in browserul televizorului.
*/

const DATA_URL = "https://andreealuupi.github.io/unitbv-news/news.json";

const SLIDE_TIME = 20000;

const CHECK_TIME = 5 * 60 * 1000;

let items = [];
let current = 0;
let slideInterval = null;
let fetching = false;
let version = "";
let requestId = 0;


/* =========================
   IMAGINE DE REZERVA

   Apare numai daca fotografia
   unui articol nu se incarca.
========================= */

function svgPoster(title) {

    const escapeXml = s =>
        String(s).replace(
            /[&<>"']/g,
            ch => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&apos;"
            })[ch]
        );

    const words = String(
        title || "Știri UNITBV"
    ).split(/\s+/);

    const lines = [];
    let line = "";

    for (const word of words) {

        if (
            line &&
            (line + " " + word).length > 29
        ) {
            lines.push(line);
            line = word;
        } else {
            line = (line + " " + word).trim();
        }
    }

    if (line) {
        lines.push(line);
    }

    const text = lines
        .slice(0, 5)
        .map((l, i) => `
            <text
                x="70"
                y="${260 + i * 65}"
                font-size="44"
                font-weight="bold"
                fill="white"
            >${escapeXml(l)}</text>
        `)
        .join("");

    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="1280"
            height="720"
            viewBox="0 0 1280 720"
        >
            <rect
                width="1280"
                height="720"
                fill="#06224a"
            />

            <circle
                cx="1100"
                cy="100"
                r="300"
                fill="#0b4f9c"
            />

            <rect
                x="70"
                y="112"
                width="350"
                height="8"
                fill="#1a73e8"
            />

            <text
                x="70"
                y="185"
                fill="#c8dcff"
                font-size="32"
            >
                UNIVERSITATEA TRANSILVANIA DIN BRAȘOV
            </text>

            ${text}
        </svg>
    `;

    return (
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg)
    );
}


/* =========================
   AFISARE SLIDE
========================= */

function showSlide(index) {

    const item = items[index];

    if (!item) {
        return;
    }

    const token = ++requestId;

    /* TITLU */

    document.getElementById("title").textContent =
        item.title || "";

    /* DESCRIERE */

    const desc =
        document.getElementById("date");

    desc.textContent =
        item.summary || "";

    desc.style.display =
        item.summary
            ? "-webkit-box"
            : "none";

    /* DATA / LOCATIE */

    document.getElementById("eventDate").textContent =
        item.date || "";

    /* IMAGINI */

    const mainImage =
        document.getElementById("image");

    const bgImage =
        document.getElementById("bgImage");

    const poster =
        svgPoster(item.title);

    mainImage.onload = null;
    bgImage.onload = null;

    mainImage.onerror = null;
    bgImage.onerror = null;

    mainImage.src = poster;
    bgImage.src = poster;

    mainImage.style.display = "block";
    bgImage.style.display = "block";

    /* INCARCARE FOTOGRAFIE REALA */

    if (item.image) {

        const loader = new Image();

        loader.onload = () => {

            if (token !== requestId) {
                return;
            }

            mainImage.onerror = () => {

                mainImage.onerror = null;
                mainImage.src = poster;
            };

            bgImage.onerror = () => {

                bgImage.onerror = null;
                bgImage.src = poster;
            };

            mainImage.src = item.image;
            bgImage.src = item.image;
        };

        loader.onerror = () => {

            console.warn(
                "Imagine indisponibila:",
                item.image
            );
        };

        loader.src = item.image;
    }

    /* ANIMATIE */

    const box =
        document.getElementById("infoBox");

    box.classList.remove("fade");

    void box.offsetWidth;

    box.classList.add("fade");
}


/* =========================
   PORNIRE SLIDESHOW
========================= */

function startSlides() {

    if (slideInterval) {
        clearInterval(slideInterval);
    }

    current = 0;

    showSlide(0);

    slideInterval = setInterval(() => {

        if (!items.length) {
            return;
        }

        current =
            (current + 1) % items.length;

        showSlide(current);

    }, SLIDE_TIME);
}


/* =========================
   INCARCARE STIRI ACTUALIZATE

   news.json se afla pe GitHub Pages
   alaturi de index.html.

   Fara probleme de CORS.
========================= */

async function loadNews() {

    if (fetching) {
        return;
    }

    fetching = true;

    const controller =
        new AbortController();

    const timer = setTimeout(
        () => controller.abort(),
        10000
    );

    try {

        const response = await fetch(
            DATA_URL + "?v=" + Date.now(),
            {
                cache: "no-store",
                signal: controller.signal
            }
        );

        if (!response.ok) {

            throw new Error(
                "news.json HTTP " +
                response.status
            );
        }

        const data = await response.json();

        if (
            !data ||
            !Array.isArray(data.items) ||
            !data.items.length
        ) {
            throw new Error(
                "news.json fara evenimente"
            );
        }

        const newVersion =
            data.updatedAt ||
            JSON.stringify(
                data.items.map(x => x.link)
            );

        /* ACTUALIZAM NUMAI DACA EXISTA MODIFICARI */

        if (version !== newVersion) {

            items = data.items;

            version = newVersion;

            startSlides();
        }

        console.log(
            "UNITBV LIVE:",
            items.length,
            "articole; actualizare:",
            data.updatedAt
        );

    } catch (error) {

        console.warn(
            "Nu pot citi news.json:",
            error.message
        );

        if (!items.length) {

            document.getElementById("title").textContent =
                "Nu s-au putut încărca știrile.";

            document.getElementById("date").textContent =
                "Verifică dacă GitHub Actions a generat news.json.";

            document.getElementById("date").style.display =
                "-webkit-box";
        }

        /* Daca deja avem stiri, continuam
           sa le afisam pana revine conexiunea. */

    } finally {

        clearTimeout(timer);

        fetching = false;
    }
}


/* =========================
   START
========================= */

loadNews();

/* VERIFICAM DATE NOI LA FIECARE 5 MINUTE */

setInterval(loadNews, CHECK_TIME);

</script>

</body>
</html>
